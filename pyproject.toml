[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "template-python-cli"
version = "0.2.0"
description = "Template project for a Python command-line application using best practices"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Template Authors", email = "maintainers@example.com"}
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
dependencies = []
keywords = ["cli", "template", "argparse", "best-practices"]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6"
]
yaml = ["PyYAML>=6.0"]

[project.scripts]
template-python-cli = "template_python_cli.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "C4"]
ignore = ["E203", "E266"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]
